[package]
name = "cvmfs_server_scraper"
version = "0.0.7"
edition = "2021"
rust-version = "1.88"
authors = ["Terje Kvernes <terje@kvernes.no>"]
license = "MIT"
description = "A scraper for CVMFS servers"
repository = "https://github.com/terjekv/cvmfs-server-scraper-rust"
homepage = "https://github.com/terjekv/cvmfs-server-scraper-rust"
readme = "README.md"
keywords = ["cvmfs", "scraper", "monitoring", "eessi"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
reqwest = "0.13"
tokio = { version = "1", features = ["sync", "time"] }
thiserror = "2"
semver = { version = "1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
log = "0.4"
rand = "0.10"

[dev-dependencies]
yare = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "test-util"] }
