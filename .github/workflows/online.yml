name: Online EESSI tests

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: online-tests-${{ github.event.pull_request.number }}
  # Unrelated label changes should not interrupt an active online run.
  cancel-in-progress: ${{ (github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'online-tests' }}

jobs:
  online:
    if: >-
      contains(github.event.pull_request.labels.*.name, 'online-tests') &&
      ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
       github.event.label.name == 'online-tests')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Test public EESSI deployments
        run: cargo test --locked --test online -- --ignored --test-threads=1 --nocapture
