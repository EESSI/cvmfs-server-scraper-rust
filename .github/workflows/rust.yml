name: Rust

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        rust: ["1.88.0", stable]
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy --component rustfmt --no-self-update
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.rust }}-${{ hashFiles('Cargo.lock') }}
      - name: Build
        run: cargo build --locked
      - name: Test including loopback regressions and documentation
        run: cargo test --locked
      - name: Format
        if: matrix.rust == 'stable'
        run: cargo fmt --all -- --check
      - name: Clippy
        if: matrix.rust == 'stable'
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Documentation
        if: matrix.rust == 'stable'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install coverage tools
        run: |
          rustup toolchain install stable --profile minimal --component llvm-tools-preview --no-self-update
          cargo install cargo-llvm-cov --version 0.9.1 --locked
      - name: Measure library coverage with loopback fixtures
        run: |
          mkdir -p target/llvm-cov
          cargo llvm-cov --locked --all-targets --lcov --output-path target/llvm-cov/lcov.info
      - name: Generate annotated coverage report
        run: |
          cargo llvm-cov report
          cargo llvm-cov report --html
      - name: Upload coverage reports
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage
          path: target/llvm-cov
          if-no-files-found: error
          retention-days: 14

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install audit tool
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit locked dependencies
        run: cargo audit
