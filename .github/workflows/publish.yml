name: Publish to crates.io

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: stable

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Check release tag matches the crate version
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "cvmfs_server_scraper") | .version')
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            printf '::error::Release tag %s must match Cargo.toml version v%s\n' "$RELEASE_TAG" "$version"
            exit 1
          fi
      - name: Test including loopback regressions and documentation
        run: cargo test --locked
      - name: Verify the crate can be published
        run: cargo publish --locked --dry-run --registry crates-io

  publish:
    needs: validate
    if: >-
      github.repository == 'EESSI/cvmfs-server-scraper-rust' &&
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish the crate
        run: cargo publish --locked --registry crates-io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
